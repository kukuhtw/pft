[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Keep container env (DB_*, APP_KEY…) visible to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
